apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resume-builder
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Hemang360/gitops-homelab.git
    targetRevision: main
    path: apps/resume-builder
  destination:
    server: https://kubernetes.default.svc
    namespace: resume-builder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true