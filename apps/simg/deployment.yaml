apiVersion: apps/v1
kind: Deployment
metadata:
  name: simg
  namespace: simg
  labels:
    app: simg
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simg
  template:
    metadata:
      labels:
        app: simg
    spec:
      containers:
        - name: simg
          image: hemang360/simg
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: simg-signing-key
                  key: key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20