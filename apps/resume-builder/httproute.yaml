apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: resume-builder
  namespace: resume-builder
spec:
  parentRefs:
    - name: homelab-gateway
  hostnames:
    - resume.homelab.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: resume-builder
          port: 80